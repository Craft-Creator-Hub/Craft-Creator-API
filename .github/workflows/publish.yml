# Builds every platform module and publishes its jar to CurseForge and Modrinth when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag must match mod_version in gradle.properties.
# Needs two repository secrets (Settings > Secrets and variables > Actions): CURSE_TOKEN and MODRINTH_TOKEN,
# and the project ids in gradle.properties.
name: Publish

on:
  push:
    tags:
      - 'v*'
  # Also runnable by hand from the Actions tab: "dry run" checks everything without uploading
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check, upload nothing'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 17 runs Gradle and ForgeGradle; Gradle downloads Java 21 for the NeoForge modules itself
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches mod_version
        if: github.event_name == 'push'
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$MOD_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match mod_version=$MOD_VERSION in gradle.properties"
            exit 1
          fi

      # ForgeGradle sets Minecraft up for each version on the first build: it must run without a daemon
      - name: Build
        run: ./gradlew --no-daemon build

      - name: Publish
        env:
          CURSE_TOKEN: ${{ secrets.CURSE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew --no-daemon publishMod -Ppublish=${{ github.event_name == 'push' || inputs.dry_run == false }}
