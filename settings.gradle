pluginManagement {
    repositories {
        gradlePluginPortal()
        // ModDevGradle, for the NeoForge modules
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Downloads the Java version a module needs (17, 21...) when it isn't installed
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'Craft-Creator'

include("core")

include("forge")
include("forge:forge-1.18.2")
include("forge:forge-1.20.1")

include("neoforge:neoforge-1.20.6")
include("neoforge:neoforge-1.21.1")
