# Memory of the Gradle JVM: setting up and remapping Minecraft for several versions needs a lot
org.gradle.jvmargs=-Xmx4G

# Version of Craft Creator: each jar is named and published as <mod_version>+<Minecraft version>
mod_version=4.0.0

# Publishing (see gradle/publishing.gradle): release, beta or alpha
release_type=beta
# Ids of the Craft Creator projects: the number on the CurseForge project page ("Project ID"), the id or slug on Modrinth
curseforge_project_id=435663
modrinth_project_id=kfGO5hnn
