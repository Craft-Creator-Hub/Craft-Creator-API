plugins {
    // Publishing to CurseForge and Modrinth, applied by each platform module through gradle/publishing.gradle
    id 'com.hypherionmc.modutils.modpublisher' version '2.2.4' apply false
}

repositories {}

dependencies {}

// Use the UTF-8 charset for Java compilation in every module (Windows defaults to cp1252, which breaks characters like '§')
allprojects {
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
}
